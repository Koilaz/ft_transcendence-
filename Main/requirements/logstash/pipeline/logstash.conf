input {
  http {
    port => 5000
    additional_codecs => {}
    codec => json { ecs_compatibility => disabled }
  }
  file {
    path => "/nginxlogs/traffic.json"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/nginx.sincedb"
    codec => json { ecs_compatibility => disabled }
  }
}

filter {
  if [service] == "nginx" {
    mutate {
      convert => { "status" => "integer" "request_time" => "float" }
    }
    date { match => ["timestamp", "ISO8601"] }
  }
  mutate {
    add_field => {
      "application" => "ft_transcendence"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "${LOGSTASH_USER}"
    password => "${LOGSTASH_PASSWORD}"
    index => "transcendence-logs-%{+YYYY.MM.dd}"
  }

}
