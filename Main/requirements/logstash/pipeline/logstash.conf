input {
  http {
    port => 5000
    codec => json
  }
}

filter {
  mutate {
    add_field => {
      "application" => "ft_transcendence"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "${LOGSTASH_USER}"
    password => "${LOGSTASH_PASSWORD}"
    index => "transcendence-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}
