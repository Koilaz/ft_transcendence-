events {}

http
{
    # DNS embarque de Docker (le daemon ecoute sur 127.0.0.11 dans le
    # reseau du conteneur). SANS ce resolver, nginx resout les noms
    # (backend, game, frontend) une seule fois au demarrage et garde les
    # IP en cache : recreer un conteneur lors d'un make lui donne une
    # nouvelle IP, et nginx continue de contacter l'ancienne -> 502 sur
    # tout ce qui passe par lui jusqu'a un restart de nginx. Avec le
    # resolver et des variables dans proxy_pass (voir plus bas), la
    # resolution se refait a l'execution toutes les 10 s.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Types MIME par extension : sans cette inclusion, nginx sert tout en
    # text/plain. Les avatars doivent etre declares avec leur vrai type
    # image/* : X-Content-Type-Options nosniff interdit au navigateur de
    # renifler, et une image declaree text/plain est alors refusee (ORB).
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ======================================================
    # Limitation de debit anti brute-force
    # ======================================================
    # Les routes d'authentification ne doivent pas pouvoir etre
    # martelees : 10 essais/min/IP pour login et register (une
    # rafale courte est toleree pour les fautes de frappe), et
    # 6 uploads/min/IP pour les avatars. Le depassement repond 429.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=avatar_limit:10m rate=6r/m;
    limit_req_status 429;
    # ======================================================
    # Masquage du JWT dans les logs
    # ======================================================
    # Les WebSockets transportent leur token en query string,
    # car l'API WebSocket du navigateur ne permet pas d'ajouter
    # un header Authorization.
    #
    # Sans ce masquage, chaque handshake écrit un JWT valide en
    # clair dans access.log. Un token dans un fichier de log est
    # un token rejouable.
    #
    # Limite connue : la regex ne masque que la DERNIERE occurrence
    # de "token=". Une URL contenant deux fois le paramètre laisserait
    # la premiere en clair. Cas theorique ici (c'est notre frontend
    # qui construit l'URL), mais a savoir.

    map $args $args_masked
    {
        default $args;
        "~(?<prefix>.*)token=[^&]*(?<suffix>.*)" "${prefix}token=REDACTED${suffix}";
    }

    # Reconstruit le "?" seulement s'il reste quelque chose apres masquage.
    # Sans ca, les URL sans query string seraient loggees avec un "?" orphelin.
    map $args_masked $query_suffix
    {
        ""      "";
        default "?$args_masked";
    }

    # On ne peut PAS utiliser $request ici : cette variable contient la
    # ligne de requete brute, query string incluse, donc le token en clair.
    # On la reconstruit a la main a partir de $uri + la query masquee.
    log_format masked '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $uri$query_suffix $server_protocol" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    server
    {
        # Écoute sur le port HTTPS.
        listen 443 ssl;

        # Nom de domaine attendu.
        server_name localhost;

        # Upstream en variables : oblige nginx a passer par le resolver
        # (cf. en tete du fichier http) au lieu de resoudre les noms une
        # fois pour toutes au demarrage. Sans URI dans proxy_pass, nginx
        # transmet la requete avec son URI d'origine, comportement
        # identique a la version statique.
        set $upstream_backend http://backend:3000;
        set $upstream_game http://game:3000;
        set $upstream_frontend http://frontend:5173;
        set $upstream_grafana http://grafana:3000;
        set $upstream_kibana http://kibana:5601;

        # On accepte pas de dl une image superieur a 2Mo
        client_max_body_size 2M;

        # Certificat TLS.
        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;

        # Versions TLS autorisées.
        ssl_protocols TLSv1.2 TLSv1.3;

        # Applique le format de log qui masque le token.
        # Note : error_log n'est pas couvert par ce masquage. En cas
        # d'erreur upstream, nginx peut y ecrire l'URI complete.
        access_log /var/log/nginx/access.log masked;

        # Headers de securite globaux (les locations qui definissent
        # leurs propres add_header ne les heritent pas, c'est le cas
        # voulu de /uploads/).
        #  - HSTS : https uniquement, pas de retour possible en http.
        #  - nosniff : le navigateur n'interprete jamais un autre type
        #    MIME que celui declare.
        #  - X-Frame-Options : le site n'est pas encadrable (clickjacking).
        #  - CSP : le frontend ne charge rien d'origine externe, y compris
        #    les polices (auto-hebergees dans public/fonts, voir
        #    src/fonts.css). Le 'unsafe-inline' sur script-src est impose
        #    par Vite en dev (preamble @react-refresh injecte inline).
        #    A resserrer vers un build de production si le site passe en
        #    vite build.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'" always;

        # Authentification : debit limite (voir zone en tete de http).
        location /api/auth/login
        {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass $upstream_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /api/auth/register
        {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass $upstream_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Upload d'avatar : debit limite pour eviter de saturer le
        # stockage de fichiers inutiles.
        location /api/auth/me/avatar
        {
            limit_req zone=avatar_limit burst=3 nodelay;
            proxy_pass $upstream_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }


        location /uploads/
        {
            alias /app/uploads/;

            # Ces fichiers viennent d'Internet : le mimetype declare par
            # le client n'a pas ete verifie a l'upload (seul le serveur
            # backend re-encode). Le navigateur ne doit donc ni renifler
            # un autre type que celui envoye, ni executer quoi que ce soit
            # si un polyglot a reussi a passer.
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        }


        # ==================================================
        # WebSocket : presence (online/offline des amis)
        # -> service backend (NestJS)
        # ==================================================
        location /ws/presence
        {
            # Un navigateur envoie toujours Origin sur un handshake WS ;
            # une Origin differente du site = un site tiers tente
            # d'ouvrir la socket (Cross-Site WebSocket Hijacking). Le
            # token en query reste requis, mais on refuse tout de suite.
            # Les clients non-navigateur sans Origin sont aussi refuses.
            if ($http_origin != "https://$http_host")
            {
                return 403;
            }

            # Pas de slash final : nginx transmet l'URI intacte.
            # Le gateway filtre sur pathname === '/ws/presence',
            # donc il DOIT recevoir le chemin complet.
            proxy_pass $upstream_backend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
            proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
            proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }


        # ==================================================
        # WebSocket : jeu (AImpostor)
        # -> service game (Node/Express + ws)
        # ==================================================
        location /ws/game
        {
            # Refus des handshakes cross-origin (cf. /ws/presence), mais
            # seulement des handshakes : le health check du front fait un
            # HEAD /ws/game sans en-tete Origin (un fetch same-origin n'en
            # envoie pas) et doit atteindre le service game, qui repond 204
            # (server.js). Un HEAD sans Origin sous l'ancien if etait refuse
            # en 403 avant meme d'etre proxifie : la console affichait une
            # erreur rouge et waitForGameServer ne distinguait plus game up
            # de game down. nginx ne permet pas de combiner deux if : on
            # marque les requetes d'upgrade, puis on efface le marqueur si
            # l'origine est la bonne.
            set $ws_origin_bad "";
            if ($http_upgrade != "")
            {
                set $ws_origin_bad "ws";
            }
            if ($http_origin = "https://$http_host")
            {
                set $ws_origin_bad "";
            }
            if ($ws_origin_bad = "ws")
            {
                return 403;
            }

            proxy_pass $upstream_game;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
            proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
            proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }


        # Metriques Prometheus du backend : prometheus les lit en direct
        # sur backend:3000 dans le reseau docker. Exposees ici, elles
        # donneraient a n'importe qui les routes, le trafic et l'etat du
        # process. Regex insensible a la casse avec slash final optionnel :
        # Express ignore les deux, /api/Metrics et /api/metrics/ servent
        # la meme route.
        location ~* ^/api/metrics/?$
        {
            return 404;
        }

        location /api/
        {
            proxy_pass $upstream_backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }


        # ==================================================
        # Monitoring : Grafana (metriques) et Kibana (logs)
        # ==================================================
        # Les deux applis ont leur propre authentification. La CSP et le
        # X-Frame-Options globaux sont tailles pour le frontend (Grafana
        # a besoin de 'unsafe-eval', Kibana de workers blob:) : definir
        # des add_header ici coupe leur heritage, on ne garde que HSTS et
        # nosniff. Anti-iframe : Grafana envoie deja X-Frame-Options deny,
        # Kibana rien du tout, on lui ajoute SAMEORIGIN (la valeur qu'il
        # pose lui-meme quand on desactive l'embedding).
        #
        # Redirection sans slash final : URL absolue construite sur
        # $http_host, sinon nginx redirige vers son port interne (443)
        # et perd le NGINX_PORT publie.
        location = /grafana
        {
            return 301 https://$http_host/grafana/;
        }

        location /grafana/
        {
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options nosniff always;

            proxy_pass $upstream_grafana;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /kibana
        {
            return 301 https://$http_host/kibana/;
        }

        location /kibana/
        {
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options SAMEORIGIN always;

            proxy_pass $upstream_kibana;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }


        # Le frontend en dernier : c'est le fourre-tout.
        # Les headers Upgrade sont necessaires pour le Hot Module
        # Replacement de Vite, qui passe lui aussi par une WebSocket.
        location /
        {
            proxy_pass $upstream_frontend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
        }
    }
}

