global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'nginx'
    static_configs:
      - targets:
          - nginx_exporter:4040

  - job_name: 'backend'
    metrics_path: /api/metrics
    static_configs:
      - targets:
          - backend:3000

  - job_name: 'postgres'
    static_configs:
      - targets:
          - postgres_exporter:9187

  - job_name: 'game'
    metrics_path: /metrics
    static_configs:
      - targets:
          - game:3000
