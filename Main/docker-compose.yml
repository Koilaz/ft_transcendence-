# ==========================================================
# ft_transcendence
#
# Architecture :
#
#            Internet
#                │
#              Nginx
#             /     \
#      Frontend    Backend
#                     │
#                PostgreSQL
#
# Chaque service est isolé dans son propre container Docker.
# Toutes les communications internes passent par le réseau Docker
# "transcendence"
# ==========================================================

services:
  postgres:
    container_name: postgres
    image: postgres:local
    build: ./requirements/postgres
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./secrets:/run/secrets:ro
    networks:
      - transcendence
    restart: unless-stopped

  backend:
    container_name: backend
    image: backend:local
    build: ./requirements/backend
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      logstash:
        condition: service_healthy
    volumes:
      - ./secrets:/run/secrets:ro
      - uploads_data:/app/uploads
    networks:
      - transcendence
    restart: unless-stopped

  postgres_exporter:
    container_name: postgres_exporter
    image: quay.io/prometheuscommunity/postgres-exporter:v0.19.1
    # Dashboard metrics do not need WAL files; the application DB user cannot
    # execute pg_ls_waldir(). Keep this flag when recreating the exporter.
    command: ["--no-collector.wal", "--config.file=/etc/postgres_exporter.yml"]
    environment:
      DATA_SOURCE_URI: "postgres:5432/${POSTGRES_DB}?sslmode=disable"
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS_FILE: /run/secrets/postgres_password.txt
    volumes:
      - ./secrets:/run/secrets:ro
      - ./requirements/postgres_exporter/postgres_exporter.yml:/etc/postgres_exporter.yml:ro
    networks:
      - transcendence
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nginx_exporter:
    container_name: nginx_exporter
    image: quay.io/martinhelmich/prometheus-nginxlog-exporter:v1.11.0
    command: ["-config-file", "/etc/nginx-exporter.yml"]
    volumes:
      - nginx_logs:/var/log/nginx:ro
      - ./requirements/nginx_exporter/config.yml:/etc/nginx-exporter.yml:ro
    networks:
      - transcendence
    restart: unless-stopped

  prometheus:
    container_name: prometheus
    image: prom/prometheus:latest
    volumes:
      - ./requirements/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - transcendence
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    entrypoint: ["/bin/sh", "/grafana-entrypoint.sh"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # /run.sh de l'image lit les variables GF_*__FILE dans le fichier pointe.
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password.txt
      GF_USERS_ALLOW_SIGN_UP: "false"

      GF_SERVER_ROOT_URL: "https://${DOMAIN_NAME}:${NGINX_PORT}/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
    volumes:
      - ./secrets:/run/secrets:ro
      - grafana_data:/var/lib/grafana
      - ./requirements/grafana/entrypoint.sh:/grafana-entrypoint.sh:ro
      - ./requirements/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./requirements/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - transcendence
    depends_on:
      - prometheus
    restart: unless-stopped

  elasticsearch:
    container_name: elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    # L'image connait ELASTIC_PASSWORD_FILE mais refuse un fichier lisible par
    # "others", or l'uid 1000 du container n'est pas le proprietaire du secret
    # sur l'hote. On lit donc le secret ici, puis on relance l'entrypoint
    # d'origine de l'image.
    entrypoint:
      - /bin/sh
      - -c
      - |
        export ELASTIC_PASSWORD="$$(tr -d '\n' < /run/secrets/elastic_password.txt)"
        exec /bin/tini -- /usr/local/bin/docker-entrypoint.sh eswrapper
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - path.repo=/usr/share/elasticsearch/backups
    volumes:
      - ./secrets:/run/secrets:ro
      - elasticsearch_data:/usr/share/elasticsearch/data
      - elasticsearch_backups:/usr/share/elasticsearch/backups
    networks:
      - transcendence
    depends_on:
      elasticsearch-backup-init:
        condition: service_completed_successfully
    restart: unless-stopped

  elasticsearch-init:
    container_name: elasticsearch-init
    image: curlimages/curl:latest
    environment:
      ELASTIC_USERNAME: "elastic"
    volumes:
      - ./secrets:/run/secrets:ro
      - ./requirements/elasticsearch:/elasticsearch:ro
    networks:
      - transcendence
    depends_on:
      - elasticsearch
    entrypoint: ["/bin/sh", "/elasticsearch/init-elasticsearch.sh"]
    restart: "no"

  elasticsearch-backup-init:
    container_name: elasticsearch-backup-init
    image: busybox:latest
    user: "0"
    volumes:
      - elasticsearch_backups:/usr/share/elasticsearch/backups
    command: >
      sh -c "
      chown -R 1000:0 /usr/share/elasticsearch/backups &&
      chmod -R 775 /usr/share/elasticsearch/backups
      "
    restart: "no"

  logstash:
    container_name: logstash
    image: docker.elastic.co/logstash/logstash:9.5.5
    # logstash.conf lit ${LOGSTASH_PASSWORD} dans l'environnement : on le
    # remplit depuis le secret avant l'entrypoint d'origine de l'image.
    entrypoint:
      - /bin/sh
      - -c
      - |
        export LOGSTASH_PASSWORD="$$(tr -d '\n' < /run/secrets/logstash_password.txt)"
        exec /usr/local/bin/docker-entrypoint
    environment:
      LOGSTASH_USER: "logstash_internal"
    volumes:
      - ./secrets:/run/secrets:ro
      - ./requirements/logstash/pipeline:/usr/share/logstash/pipeline:ro
      - nginx_logs:/nginxlogs:ro
      - logstash_data:/usr/share/logstash/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    networks:
      - transcendence
    depends_on:
      elasticsearch-init:
        condition: service_completed_successfully
    restart: unless-stopped

  kibana:
    container_name: kibana
    image: docker.elastic.co/kibana/kibana:9.5.5
    # kibana-docker traduit ces variables en reglages kibana.yml mais ne sait
    # pas lire de fichier : on les remplit depuis les secrets, puis on relance
    # l'entrypoint d'origine de l'image. Les cles font au moins 32 caracteres.
    entrypoint:
      - /bin/sh
      - -c
      - |
        export ELASTICSEARCH_PASSWORD="$$(tr -d '\n' < /run/secrets/kibana_password.txt)"
        export XPACK_SECURITY_ENCRYPTIONKEY="$$(tr -d '\n' < /run/secrets/kibana_security_encryption_key.txt)"
        export XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY="$$(tr -d '\n' < /run/secrets/kibana_saved_objects_encryption_key.txt)"
        export XPACK_REPORTING_ENCRYPTIONKEY="$$(tr -d '\n' < /run/secrets/kibana_reporting_encryption_key.txt)"
        exec /bin/tini -- /usr/local/bin/kibana-docker
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      ELASTICSEARCH_USERNAME: "kibana_system"
      SERVER_BASEPATH: "/kibana"
      SERVER_REWRITEBASEPATH: "true"
      SERVER_PUBLICBASEURL: "https://${DOMAIN_NAME}:${NGINX_PORT}/kibana"
      XPACK_SECURITY_SECURECOOKIES: "true"
    volumes:
      - ./secrets:/run/secrets:ro
    networks:
      - transcendence
    depends_on:
      elasticsearch-init:
        condition: service_completed_successfully
    restart: unless-stopped

  kibana-init:
    container_name: kibana-init
    image: curlimages/curl:latest
    environment:
      ELASTIC_USERNAME: "elastic"
    volumes:
      - ./secrets:/run/secrets:ro
      - ./requirements/kibana:/kibana:ro
    networks:
      - transcendence
    depends_on:
      - kibana
    entrypoint: ["/bin/sh", "/kibana/init-kibana.sh"]
    restart: "no"

  game:
    container_name: game
    image: game:local
    build: ./requirements/game
    depends_on:
      logstash:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./secrets:/run/secrets:ro
    networks:
      - transcendence
    restart: unless-stopped

  ollama:
    container_name: ollama
    image: ollama/ollama:latest
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_FLASH_ATTENTION=1
    volumes:
      - ${OLLAMA_DATA_DIR}:/root/.ollama
    networks:
      - transcendence
    restart: unless-stopped

  frontend:
    container_name: frontend
    image: frontend:local
    build: ./requirements/frontend
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - transcendence
    restart: unless-stopped


  nginx:
    container_name: nginx
    image: nginx:local
    build: ./requirements/nginx
    env_file:
      - .env

    # nginx est démarré après le backend.
    # Attention : depends_on veut dire "démarré", pas forcément "prêt".
    depends_on:
      - frontend
      - backend
      - game

    # nginx sera le seul point d'entrée vers l'extérieur.
    # Le navigateur parle à la machine hôte sur ${NGINX_PORT}
    # puis Docker redirige vers le port 443 du container nginx.
    ports:
      - "${NGINX_PORT}:443"

    # nginx aura besoin des certificats TLS.
    # :ro = read-only : nginx peut lire les secrets mais pas les modifier.
    volumes:
      - ./secrets:/run/secrets:ro
      - uploads_data:/app/uploads:ro
      - nginx_logs:/var/log/nginx

    networks:
      - transcendence
    restart: unless-stopped


networks:
  transcendence:
    name: transcendence
    driver: bridge

volumes:
  postgres_data:
    driver: local

  uploads_data:
    driver: local

  grafana_data:
    driver: local

  elasticsearch_data:
    driver: local

  elasticsearch_backups:
    driver: local

  nginx_logs:
    driver: local

  logstash_data:
    driver: local
